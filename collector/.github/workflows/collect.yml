name: collect
on:
  schedule:
    - cron: "7,27,47 * * * *"   # safety net: restarts the chain if it ever stops (GitHub may delay it)
  workflow_dispatch:            # manual start ("Run workflow") and automatic chaining

permissions:
  contents: write
  actions: write                # lets a run queue the next run with the built-in token

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crypto library
        run: pip install cryptography
      - name: Collect whale data
        env:
          WHALE_MASTER: ${{ secrets.WHALE_MASTER }}
        run: python collector/whale_collector.py --out out/data.json
      - name: Publish the JSON files to the "data" branch (history is overwritten each time)
        run: |
          mkdir -p /tmp/pub && cp out/*.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin data
      - name: Queue the next run in about 2.5 minutes (self-chaining, no personal token needed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sleep 150
          others=$(gh run list --workflow collect.yml --limit 20 --json databaseId,status --jq "[.[] | select(.status != \"completed\" and (.databaseId | tostring) != \"$RUN_ID\")] | length")
          echo "other active or queued runs: $others"
          if [ "$others" = "0" ]; then
            gh workflow run collect.yml --ref "$REF_NAME"
            echo "queued the next run"
          else
            echo "another run is already queued; not queuing a new one"
          fi
