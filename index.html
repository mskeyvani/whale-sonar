  const H=A.H,K=A.K;

const BASE="https://raw.githubusercontent.com/mskeyvani/whale-sonar/data/",BUY_URL="https://www.mahquant.com";
let mode="free",PUB=null,LIC=null;
const fj=async n=>{const r=await fetch(BASE+n+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(n+" "+r.status);return r.json()};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hex=h=>Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
function parseLic(t){try{t=String(t||"").trim();if(!t.startsWith("MQ1."))return null;let p=t.slice(4).replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";const o=JSON.parse(atob(p));return o&&o.id&&/^[0-9a-f]{64}$/.test(o.key||"")&&/^\d{4}-\d\d-\d\d$/.test(o.exp||"")?o:null}catch(e){return null}}
async function unlock(L){const [K,E]=await Promise.all([fj("keys.json"),fj("data.enc.json")]);const w=K.keys[L.id];if(!w)throw new Error("inactive");
  const S=crypto.subtle,ku=await S.importKey("raw",hex(L.key),"AES-GCM",false,["decrypt"]);
  const dk=await S.importKey("raw",await S.decrypt({name:"AES-GCM",iv:b64(w.iv)},ku,b64(w.ct)),"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await S.decrypt({name:"AES-GCM",iv:b64(E.iv)},dk,b64(E.ct))))}
let licMsg="";
async function pull(){
  let snap=null;licMsg="";
  try{PUB=await fj("public.json")}catch(e){PUB=null}
  if(LIC){try{snap=await unlock(LIC);mode="paid"}catch(e){mode="free";licMsg=/404/.test(e.message)?"":(e.message==="inactive"?(LIC.exp<new Date().toISOString().slice(0,10)?"expired":"inactive"):"invalid")}}
  if(!snap&&licMsg===""){try{snap=await fj("data.json");mode="open"}catch(e){mode="free"}}
  if(snap){D=mapSnap(snap);meta={sample:false,live:true,time:Date.parse(snap.generated_at)||Date.now()}}
  else if(PUB){D=[];meta={sample:false,live:true,time:Date.parse(PUB.generated_at)||Date.now()}}
  else{if(meta.sample)$("#msg").textContent=TR("دریافت خودکار داده ممکن نشد؛ نمونه نمایش داده می‌شود. می‌توانی snapshot.json را دستی بارگذاری کنی.");return}
  status();render();openHash();if(curW&&mode!=="free")openW(curW,1);
}
function freeMsg(){return licMsg==="expired"?X("لایسنس منقضی شده است؛ برای تمدید با ما تماس بگیر.","Your license has expired; contact us to renew."):licMsg==="inactive"?X("این لایسنس فعال نیست (ممکن است منقضی یا حذف شده باشد).","This license is not active (expired or removed)."):licMsg==="invalid"?X("لایسنس معتبر نیست یا باز نشد.","The license is not valid or could not be opened."):X("نسخه‌ی رایگان: فقط خلاصه‌ی سنتیمنت. برای دسترسی کامل لایسنس وارد کن.","Free version: sentiment overview only. Enter a license for full access.")}
function licBtn(){const b=$("#lc");if(!b)return;b.style.display=mode==="open"?"none":"";if(mode==="paid"&&LIC){const d=Math.max(0,Math.ceil((Date.parse(LIC.exp+"T23:59:59Z")-Date.now())/864e5));b.textContent="🔓 "+LIC.plan+" · "+d+X(" روز"," d");b.className="btn"+(d<=5?" r":"")}else{b.textContent="🔑 "+X("ورود لایسنس","Enter license");b.className="btn"}}
function openLic(){const P=$("#lm");P.replaceChildren();P.hidden=false;const w=el("div","wrap"),msg=el("div","note"),ta=el("textarea","ta"),row=el("div","ctl");
  ta.placeholder="MQ1.…";msg.textContent=X("متنی را که بعد از خرید دریافت کرده‌ای دقیقاً paste کن (با MQ1. شروع می‌شود). لایسنس فقط در مرورگر خودت ذخیره می‌شود.","Paste the text you received after purchase exactly as is (it starts with MQ1.). The license is stored only in your browser.");
  const ok=el("button","btn pri",X("فعال‌سازی","Activate")),cl=el("button","btn",X("بستن","Close")),buy=el("a","btn",X("خرید / تمدید","Buy / renew"));buy.href=BUY_URL;buy.target="_blank";buy.rel="noopener";
  ok.onclick=()=>{const o=parseLic(ta.value);if(!o){msg.textContent=X("کد معتبر نیست. دقیقاً همان متن را با MQ1. شروع کن و کامل paste کن.","Invalid code. Paste the full text starting with MQ1.");return}
    try{localStorage.setItem("mq_lic",ta.value.trim())}catch(e){}LIC=o;P.hidden=true;pull()};
  cl.onclick=()=>{P.hidden=true};row.append(ok,cl,buy);
  if(LIC){const rm=el("button","btn r",X("حذف لایسنس از این مرورگر","Remove license from this browser"));rm.onclick=()=>{try{localStorage.removeItem("mq_lic")}catch(e){}LIC=null;mode="free";P.hidden=true;pull()};row.append(rm)}
  w.append(el("h2",0,X("ورود لایسنس","Enter license")),msg,ta,row);P.append(w)}
function lockBox(){const b=el("div","panel lock"),a=el("button","btn pri",X("ورود لایسنس","Enter license")),u=el("a","btn",X("خرید لایسنس","Get a license"));a.onclick=openLic;u.href=BUY_URL;u.target="_blank";u.rel="noopener";
  b.append(el("b",0,"🔒 "+X("این بخش‌ها با لایسنس باز می‌شوند","These sections unlock with a license")),el("p","mu",X("فهرست نهنگ‌ها، صفحه‌ی هر نهنگ، نهنگ‌های برتر، سنتیمنت بر اساس اندازه‌ی نهنگ‌ها، شلوغ‌ترین Longها و Shortها و خلاصه‌ی هوشمند.","Whale list, whale pages, top performers, sentiment by whale size, most crowded Longs/Shorts and the smart summary.")),a,u);return b}
function aggOfD(){const tp=D.filter(w=>w.perf&&w.perf.month&&w.perf.month.pnl!=null).sort((a,b)=>b.perf.month.pnl-a.perf.month.pnl).slice(0,20),H={},K={};
  D.forEach(w=>w.pos.forEach(p=>{[[H,p.coin],[K,catOf(p.coin)]].forEach(([M_,k])=>{const h=M_[k]||(M_[k]={l:0,s:0,nl:0,ns:0});if(p.side==="L"){h.l+=p.n;h.nl++}else{h.s+=p.n;h.ns++}})}));
  return{all:senti(D),sm:tp.length>=5?senti(tp):null,H,K,full:true}}

  if(tab==="senti"&&PUB.all){sentiView(v,aggOfPub());v.append(lockBox())}else v.append(lockBox());
